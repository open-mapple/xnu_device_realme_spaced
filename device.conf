# The realme 8i. Its SoC layer is kernel/mediatek/mt6781.
device spaced
	title	realme 8i (spaced)
	vendor	realme
	soc	mt6781
	defconfig	spaced_defconfig
	firmware	pull-firmware.sh
	maintainer	DrtSinX98
	light_ui	1
	bluetooth	1
	status display partial the framebuffer LK leaves (1080x2412): the UI drawn through Metal on the GPU (mp_gpu=2) or in software
	status touch partial the ILI7807S on SPI4 (touchscreen=3, mtkloader XNU_TOUCH_ILI=1): taps, swipes, up to three fingers; the firmware sent again when the chip loses it; slow on one core
	status buttons works power and volume: volume down on the keypad, volume up and power on the MT6358 (buttons=3)
	status cpu missing
	status gpu partial the Mali-G57 MC2 at LK's rails and clock (mp_gpu_lkrails=1, 300 MHz) through Panfrost: Metal draws the UI; heavy posters run out of memory
	status storage partial the system image in xnusys on the UFS (LUN 2) as the root, read-write (mp_ufsrw=1 mp_rootrw=1), polled
	status sensors missing
	status wifi works the MT6631 (mp_wifi_steps=5): scan and WPA2-PSK join from Settings, DHCP, Safari and long downloads
	status bluetooth partial the MT6631 over STP on BTIF (mp_bt_steps=2): on in Settings, LE scan, pairing; a classic keyboard types (IOHIDResource, mp_hidres=1); no A2DP
	status audio partial the speaker (DL1, MT6366 line-out, AW87319; mp_audio_steps 4, the default) 20 dB under Android's level through the guard, and the main mic (AIN0, VUL12; mp_audio_steps=5) while an app records; no earpiece or headset
	status battery partial the fuel gauge's charge and voltage are read; the charger is not driven
	status haptic works the VIBR motor at Android's 2.8 V from iOS's haptics (mp_vib_steps=2, mkadt --haptics)
	status camera missing
	status torch missing
	status cellular missing
	status thermal partial LVTS reads the CPU sensors with mtkloader's calibration (mp_lvts_golden, mp_lvts_r)
